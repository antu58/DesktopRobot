<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实时多模态网页测试（语音+视频）</title>
  <style>
    :root {
      --bg: #081426;
      --panel: #0f1c2f;
      --line: rgba(148, 163, 184, 0.28);
      --text: #dbeafe;
      --muted: #93a7c3;
      --ok: #22c55e;
      --warn: #f59e0b;
      --backend: #a7f3d0;
      --vision: #93c5fd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #122645 0%, #081426 65%, #050a14 100%);
      color: var(--text);
    }
    .root {
      max-width: 1360px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 14px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(15, 28, 47, 0.9);
      padding: 14px;
    }
    h1 { margin: 0 0 10px 0; font-size: 20px; }
    h2 { margin: 0 0 8px 0; font-size: 16px; }
    .sub { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      cursor: pointer;
      color: #081426;
      font-weight: 600;
    }
    #startBtn { background: var(--ok); }
    #stopBtn { background: var(--warn); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status, #backendState, #visionState, #meta { font-size: 13px; color: var(--muted); }
    #backendState { color: #c4b5fd; }
    #visionState { color: var(--vision); }
    video {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #000;
      margin-bottom: 10px;
    }
    .box {
      min-height: 220px;
      max-height: 340px;
      overflow: auto;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #050d1b;
      padding: 10px;
      line-height: 1.55;
      white-space: pre-wrap;
      font-size: 14px;
    }
    .stack { display: grid; grid-template-rows: auto auto; gap: 12px; }
    .asr-final { color: #e5e7eb; }
    .asr-partial { color: #93c5fd; }
    .backend { color: var(--backend); }
    .vision { color: var(--vision); }
    .warn { color: #fbbf24; }
    @media (max-width: 980px) {
      .root { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="root">
    <section class="card">
      <h1>实时多模态采集</h1>
      <div class="sub">同一连接上传音频PCM与视频帧，边缘端完成ASR与视觉编排后返回文本。</div>
      <div class="row">
        <button id="startBtn">开始</button>
        <button id="stopBtn" disabled>停止</button>
        <span id="status">状态: 未连接</span>
        <span id="backendState">后端: 空闲</span>
        <span id="visionState">视觉: 空闲</span>
      </div>
      <div id="meta"></div>
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas" width="960" height="540" style="display:none"></canvas>
      <h2>ASR 转写</h2>
      <div id="transcript" class="box"></div>
    </section>

    <section class="card stack">
      <div>
        <h2>LLM 文本回复</h2>
        <div id="backendResp" class="box"></div>
      </div>
      <div>
        <h2>视觉链路日志</h2>
        <div id="visionLog" class="box"></div>
      </div>
    </section>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const backendStateEl = document.getElementById("backendState");
    const visionStateEl = document.getElementById("visionState");
    const metaEl = document.getElementById("meta");
    const transcriptEl = document.getElementById("transcript");
    const backendEl = document.getElementById("backendResp");
    const visionLogEl = document.getElementById("visionLog");
    const videoEl = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let ws = null;
    let micStream = null;
    let audioCtx = null;
    let source = null;
    let processor = null;
    let running = false;
    let pingTimer = null;
    let frameTimer = null;
    let partialLine = null;
    let wsBackpressureWarned = false;
    const streamLines = new Map();

    const WS_MAX_BUFFERED_BYTES = 1024 * 1024;
    const FRAME_INTERVAL_MS = 1000;
    const FRAME_WIDTH = 1280;
    const FRAME_HEIGHT = 720;

    function setStatus(s) { statusEl.textContent = `状态: ${s}`; }
    function setBackendState(s) { backendStateEl.textContent = `后端: ${s}`; }
    function setVisionState(s) { visionStateEl.textContent = `视觉: ${s}`; }

    function mapBackendStage(stage) {
      const table = {
        queued: "排队中",
        queue_busy: "队列繁忙",
        thinking: "LLM推理中",
        streaming: "LLM输出中",
        completed: "回复完成",
        interrupting: "准备打断",
        interrupted: "已打断",
        timeout: "请求超时",
        failed: "后端失败"
      };
      return table[stage] || stage || "未知";
    }

    function fmtTime(tsMs) {
      const d = new Date(tsMs || Date.now());
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    }

    function appendLine(el, text, cls) {
      const line = document.createElement("div");
      line.className = cls;
      line.textContent = text;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function upsertBackendStream(msg) {
      const requestId = msg.request_id || `req-${Date.now()}`;
      let line = streamLines.get(requestId);
      if (!line) {
        line = document.createElement("div");
        line.className = "backend";
        line.dataset.reply = "";
        backendEl.appendChild(line);
        streamLines.set(requestId, line);
      }

      let reply = line.dataset.reply || "";
      if (msg.delta) {
        reply += msg.delta;
      }
      if (msg.reply && !msg.delta) {
        reply = msg.reply;
      }
      line.dataset.reply = reply;
      line.textContent = reply;

      if (msg.final) {
        streamLines.delete(requestId);
      }
      backendEl.scrollTop = backendEl.scrollHeight;
    }

    function renderAsr(msg) {
      const label = `[${msg.language}|${msg.emotion}|${msg.audio_event}|final=${msg.final}] `;
      const text = `${label}${msg.text || ""}`;
      if (!msg.final) {
        if (!partialLine) {
          partialLine = document.createElement("div");
          partialLine.className = "asr-partial";
          transcriptEl.appendChild(partialLine);
        }
        partialLine.textContent = text;
      } else {
        if (partialLine) {
          partialLine.className = "asr-final";
          partialLine.textContent = text;
          partialLine = null;
        } else {
          appendLine(transcriptEl, text, "asr-final");
        }
      }
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function downsampleBuffer(buffer, inputRate, outputRate) {
      if (outputRate === inputRate) return buffer;
      const ratio = inputRate / outputRate;
      const newLength = Math.round(buffer.length / ratio);
      const result = new Float32Array(newLength);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0;
        let count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
          accum += buffer[i];
          count++;
        }
        result[offsetResult] = count > 0 ? accum / count : 0;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function float32ToInt16(float32Array) {
      const int16 = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return int16;
    }

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/ws/client`;
    }

    function sendFrame() {
      if (!running || !ws || ws.readyState !== WebSocket.OPEN) return;
      if (!videoEl.videoWidth || !videoEl.videoHeight) return;
      if (ws.bufferedAmount > WS_MAX_BUFFERED_BYTES) return;

      canvas.width = FRAME_WIDTH;
      canvas.height = FRAME_HEIGHT;
      ctx.drawImage(videoEl, 0, 0, FRAME_WIDTH, FRAME_HEIGHT);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
      ws.send(JSON.stringify({ event: "frame", ts_ms: Date.now(), image: dataUrl }));
    }

    async function start() {
      if (running) return;
      running = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;

      transcriptEl.innerHTML = "";
      backendEl.innerHTML = "";
      visionLogEl.innerHTML = "";
      streamLines.clear();
      wsBackpressureWarned = false;
      partialLine = null;
      setBackendState("空闲");
      setVisionState("空闲");

      try {
        ws = new WebSocket(wsUrl());
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          setStatus("WebSocket已连接");
          pingTimer = setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ event: "ping" }));
            }
          }, 15000);
        };

        ws.onerror = () => {
          setStatus("WebSocket错误");
          appendLine(backendEl, "[warn] browser websocket error", "warn");
        };

        ws.onclose = (evt) => {
          const closeInfo = `WebSocket关闭 code=${evt.code} reason=${evt.reason || "-"}`;
          setStatus(closeInfo);
          appendLine(backendEl, `[warn] ${closeInfo}`, "warn");
        };

        ws.onmessage = (evt) => {
          let msg;
          try {
            msg = JSON.parse(evt.data);
          } catch (_) {
            return;
          }
          if (!msg || !msg.event) return;

          if (msg.event === "status") {
            metaEl.textContent = `session=${msg.session_id || "-"} backend_connected=${msg.backend_connected}`;
            return;
          }
          if (msg.event === "asr") {
            renderAsr(msg);
            return;
          }
          if (msg.event === "backend_result") {
            upsertBackendStream({ ...msg, final: true });
            return;
          }
          if (msg.event === "backend_stream") {
            upsertBackendStream(msg);
            return;
          }
          if (msg.event === "backend_state") {
            const label = mapBackendStage(msg.stage);
            const extra = msg.detail ? ` (${msg.detail})` : "";
            setBackendState(`${label}${extra}`);
            return;
          }
          if (msg.event === "vision_status") {
            const detail = `device=${msg.device || "-"} vlm_ready=${msg.vlm_ready ? "Y" : "N"}`;
            appendLine(visionLogEl, `[${fmtTime(msg.ts_ms)}] [connected] ${detail}`, "vision");
            return;
          }
          if (msg.event === "vision_state") {
            const d = msg.detail ? ` (${msg.detail})` : "";
            setVisionState(`${msg.stage}${d}`);
            if (msg.stage === "enabled" || msg.stage === "inject_context" || msg.stage === "disabled") {
              appendLine(visionLogEl, `[${fmtTime(msg.ts_ms)}] [${msg.stage}] ${msg.detail || ""}`.trim(), "vision");
            }
            return;
          }
          if (msg.event === "vision_analysis") {
            const logs = Array.isArray(msg.new_logs) ? msg.new_logs.join(" | ") : "";
            const summary = msg.slow_summary || "";
            appendLine(
              visionLogEl,
              `[${fmtTime(msg.ts_ms)}] people=${msg.people_count ?? "-"} ${summary} ${logs}`.trim(),
              "vision"
            );
            return;
          }
          if (msg.event === "slot_created") {
            appendLine(
              visionLogEl,
              `[${fmtTime(msg.ts_ms)}] [slot#${msg.slot_index}] ${msg.source_text || ""} ${msg.slow_summary || ""}`.trim(),
              "vision"
            );
            return;
          }
          if (msg.event === "filtered") {
            appendLine(backendEl, `[filtered] ${msg.reason}: ${msg.text || ""}`, "warn");
            return;
          }
          if (msg.event === "warn") {
            appendLine(backendEl, `[warn] ${msg.message || ""}`, "warn");
            return;
          }
        };

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        videoEl.srcObject = micStream;
        audioCtx = new AudioContext();
        source = audioCtx.createMediaStreamSource(micStream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (evt) => {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          if (ws.bufferedAmount > WS_MAX_BUFFERED_BYTES) {
            if (!wsBackpressureWarned) {
              appendLine(backendEl, `[warn] ws bufferedAmount too high (${ws.bufferedAmount}), dropping audio frames`, "warn");
              wsBackpressureWarned = true;
            }
            return;
          }
          wsBackpressureWarned = false;
          const input = evt.inputBuffer.getChannelData(0);
          const downsampled = downsampleBuffer(input, audioCtx.sampleRate, 16000);
          const pcm16 = float32ToInt16(downsampled);
          ws.send(pcm16.buffer);
        };

        source.connect(processor);
        processor.connect(audioCtx.destination);
        frameTimer = setInterval(sendFrame, FRAME_INTERVAL_MS);
      } catch (err) {
        appendLine(backendEl, `启动失败: ${err.message || err}`, "warn");
        await stop();
      }
    }

    async function stop() {
      if (!running) return;
      running = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;

      try {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ event: "flush" }));
        }
      } catch (_) {}

      if (pingTimer) clearInterval(pingTimer);
      pingTimer = null;
      if (frameTimer) clearInterval(frameTimer);
      frameTimer = null;

      if (processor) {
        processor.disconnect();
        processor.onaudioprocess = null;
      }
      if (source) source.disconnect();
      if (audioCtx) await audioCtx.close();
      if (micStream) micStream.getTracks().forEach((t) => t.stop());
      if (ws) ws.close();

      processor = null;
      source = null;
      audioCtx = null;
      micStream = null;
      ws = null;
      videoEl.srcObject = null;
      setStatus("已停止");
      setBackendState("空闲");
      setVisionState("空闲");
    }

    startBtn.addEventListener("click", start);
    stopBtn.addEventListener("click", stop);
  </script>
</body>
</html>
